name: pisio
description: "Türkiye pazarına özel, tamamen ücretsiz haftalık menü planlama ve akıllı alışveriş listesi uygulaması."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0

  # State Management
  flutter_riverpod: ^2.6.1

  # Local Database (Offline-First SQLite)
  drift: ^2.24.0
  drift_flutter: ^0.2.3
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.0

  # Utilities & Identification
  uuid: ^4.5.1
  shared_preferences: ^2.3.4

  # Sharing & Notifications
  share_plus: ^10.1.3
  flutter_local_notifications: ^18.0.1

  # UI & Design
  google_fonts: ^6.2.1

  # Cloud Sync (Supabase)
  supabase_flutter: ^2.8.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  drift_dev: ^2.24.0

flutter:
  uses-material-design: true

  assets:
    - assets/seed/
