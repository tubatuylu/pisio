name: pisio
description: "Türkiye pazarına özel, tamamen ücretsiz haftalık menü planlama ve akıllı alışveriş listesi uygulaması."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Local Storage (Web-safe)
  shared_preferences: ^2.3.4

  # Utilities & Identification
  uuid: ^4.5.1

  # Sharing
  share_plus: ^10.1.3

  # UI & Design
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/seed/
