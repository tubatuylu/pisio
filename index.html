<!DOCTYPE html>
<html lang="tr">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Pişio — Türkiye pazarına özel haftalık menü planlama uygulaması.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pişio">

  <title>Pişio — Haftalık Menü Planlayıcı</title>
  <link rel="manifest" href="manifest.json">

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <style>
    body {
      background-color: #FBF9F5;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    #splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #FBF9F5;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 99999;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: opacity 0.3s ease;
    }
    .splash-logo {
      font-size: 54px;
      margin-bottom: 12px;
    }
    .splash-title {
      font-size: 26px;
      font-weight: bold;
      color: #D94826;
      margin-bottom: 6px;
    }
    .splash-subtitle {
      font-size: 14px;
      color: #6B7280;
      margin-bottom: 24px;
    }
    .loading-spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(217, 72, 38, 0.2);
      border-radius: 50%;
      border-top-color: #D94826;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="splash">
    <div class="splash-logo">🍲</div>
    <div class="splash-title">Pişio</div>
    <div class="splash-subtitle">Mutfakta aklın rahat etsin...</div>
    <div class="loading-spinner"></div>
  </div>

  <script>
    function dismissSplash() {
      var el = document.getElementById('splash');
      if (el) {
        el.style.opacity = '0';
        setTimeout(function() {
          try { el.remove(); } catch(e) {}
        }, 300);
      }
    }
    window.addEventListener('flutter-first-frame', dismissSplash);
    // Güvenlik önlemi: En geç 3 saniye sonra splash ekranını mutlaka kaldır
    setTimeout(dismissSplash, 3000);
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
