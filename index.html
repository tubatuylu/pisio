<!DOCTYPE html>
<html lang="tr">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Pişio — Türkiye pazarına özel, tamamen ücretsiz haftalık menü planlama ve akıllı alışveriş listesi uygulaması.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pişio">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Pişio — Haftalık Menü Planlayıcı</title>
  <link rel="manifest" href="manifest.json">

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <style>
    body {
      background-color: #FBF9F5;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .splash-container {
      text-align: center;
    }
    .splash-logo {
      font-size: 48px;
      margin-bottom: 16px;
    }
    .splash-title {
      font-size: 24px;
      font-weight: bold;
      color: #D94826;
      margin-bottom: 8px;
    }
    .splash-subtitle {
      font-size: 14px;
      color: #6B7280;
      margin-bottom: 24px;
    }
    .loading-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(217, 72, 38, 0.2);
      border-radius: 50%;
      border-top-color: #D94826;
      animation: spin 0.8s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="splash-container">
    <div class="splash-logo">🍲</div>
    <div class="splash-title">Pişio</div>
    <div class="splash-subtitle">Mutfakta aklın rahat etsin...</div>
    <div class="loading-spinner"></div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
